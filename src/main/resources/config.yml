stats:
  base-mana: 100.0
  mana-regeneration-per-second: 2.0
  # Vitality is a separate resource pool spent by healing actives (e.g. Vital Touch).
  base-vitality: 100.0
  vitality-regeneration-per-second: 4.0
  # Ferocity: % chance per point of one extra melee hit; every 100 points guarantees one.
  base-ferocity: 0.0
  ferocity-cap: 500.0
  # Swing Range: melee/interaction reach in blocks (vanilla base is 3).
  base-swing-range: 3.0
  swing-range-cap: 15.0
  # Intelligence: adds directly to max Mana and scales magic-damage abilities.
  base-intelligence: 0.0
  # Ability Damage: % multiplier applied on top of magic-damage abilities.
  base-ability-damage: 0.0
  # Health Regen: % multiplier on natural-health-regen-per-second below. 100 = baseline.
  base-health-regen: 100.0
  natural-health-regen-per-second: 0.5
  # Mending: % multiplier applied to healing an ability lands on someone other than the caster.
  base-mending: 100.0
hud:
  update-ticks: 5
  spacing: "     "
combat:
  max-level: 200
  crit-chance-per-level: 0.5
  damage-percent-per-level: 4.0
  critical-damage-multiplier: 1.5
  attack-speed-level-0: 4.0
  attack-speed-level-25: 8.0
  attack-speed-level-50: 20.0
  xp-base: 100.0
  xp-exponent: 1.65
  hostile-xp-health-multiplier: 2.0
  hostile-xp-level-multiplier: 3.0
combat-tree:
  # Blood Points are the currency spent in the Combat Ability Tree to unlock and upgrade nodes.
  # Every node's rank-1 cost and per-rank cost scale with its tier (how deep it sits in the
  # tree, tier 1 = root): tierBase = base-unlock-cost + cost-per-tier * (tier - 1);
  # tierPerRank = cost-per-rank + cost-per-rank-per-tier * (tier - 1);
  # cost of rank N (1-indexed) = tierBase + tierPerRank * (N - 1).
  base-unlock-cost: 20
  cost-per-tier: 15
  cost-per-rank: 8
  cost-per-rank-per-tier: 5
  # Fallback Blood Points earned per hostile kill when the mob has no Bestiary entry,
  # ~= sqrt(mob max health) * this multiplier (min 1). Mobs with a Bestiary entry instead
  # drop the exact amount shown in the Bestiary (see BestiaryCatalog's combatXp / 10).
  valor-per-kill-multiplier: 0.3
  # Bonus Blood Points awarded per Combat level gained.
  valor-per-level: 3
mob-visuals:
  # Text Display view range uses 64-block units: 0.25 = approximately 16 blocks.
  label-view-range: 0.12
  damage-view-range: 0.25
  label-max-distance-blocks: 10.0
  # How often (in server ticks) mob name/HP labels re-check their text and viewer visibility.
  # The HP text also updates instantly on every hit regardless of this value. Higher = cheaper.
  update-ticks: 3
global-level:
  xp-per-level: 100
  # How often (in server ticks, 20 = 1s) the level-number color animation advances a frame.
  # Lower = more frequent updates and a smoother gradient. 1 = every tick (smoothest).
  badge-animation-ticks: 1
  # Interpolation sub-steps between each palette color. Higher = smoother, softer transition
  # (more precomputed frames). The overall transition speed stays roughly the same because
  # more steps are shown per second. 1 = original behaviour.
  badge-animation-smoothness: 4
  skill-xp:
    level-1-10: 5
    level-11-25: 10
    level-26-50: 20
    level-51-60: 30
    level-61-100: 40
    level-101-150: 50
    level-151-200: 60
  milestone-xp: 4
  hp-per-level: 5.0
  levels-per-strength: 5
  strength-per-global-level-group: 1
  strength-damage-percent-per-point: 1.0
