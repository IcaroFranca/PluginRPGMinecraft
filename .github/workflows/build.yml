name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: IcarusRPG-jar
          path: target/IcarusRPG-*.jar
          if-no-files-found: error
